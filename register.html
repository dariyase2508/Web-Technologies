    <!-- Основной контент: Форма регистрации для Task 1 -->
    <main class="container py-5" style="max-width: 550px;">
        <div class="text-center mb-4">
            <p class="eyebrow tracking-widest text-uppercase text-danger mb-2">Create Account</p>
            <h1 class="display-5 fw-bold font-serif mb-2" style="color: var(--espresso, #211512);">Join Le Audaci</h1>
            <p class="text-muted small">Register to save your favorite Italian spots and manage reservations.</p>
        </div>

        <form id="register-form" class="glass-card p-4 p-md-5 rounded-4 shadow-md border border-white border-opacity-50" novalidate>
            
            <!-- Email -->
            <div class="mb-3">
                <label for="reg-email" class="form-label fw-bold text-espresso small">Email Address</label>
                <input type="email" class="form-control bg-white bg-opacity-50" id="reg-email" placeholder="name@example.com" required>
                <small id="reg-email-error" class="text-danger d-block mt-1"></small>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label for="reg-password" class="form-label fw-bold text-espresso small">Password (min. 6 characters)</label>
                <input type="password" class="form-control bg-white bg-opacity-50" id="reg-password" placeholder="Enter password" required>
                <small id="reg-password-error" class="text-danger d-block mt-1"></small>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label for="reg-confirm" class="form-label fw-bold text-espresso small">Confirm Password</label>
                <input type="password" class="form-control bg-white bg-opacity-50" id="reg-confirm" placeholder="Confirm password" required>
                <small id="reg-confirm-error" class="text-danger d-block mt-1"></small>
            </div>

            <button type="submit" class="btn w-100 py-3 text-white fw-bold tracking-wider text-uppercase rounded-3 shadow-sm" style="background-color: #d9534f; border: none;">
                <i class="bi bi-person-plus-fill me-2"></i> Register Now
            </button>
        </form>
    </main>

    <!-- Обязательный Футер -->
    <footer>
        <div class="text-center my-4">
    <button id="color-btn" class="btn btn-outline-dark px-4 py-2 rounded-pill shadow-sm">
        <i class="bi bi-palette-fill me-2"></i>Change Background Color
    </button>
</div>
        <p>&copy; 2026 Le Audaci | Group SE-2508. Project Authors: Assiya, Dariya, Akerke</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        document.addEventListener('DOMContentLoaded', function() {
            const colorBtn = document.getElementById('color-btn');
            if (colorBtn) {
                // Массив стильных оттенков для сайта ресторана
                const bgColors = ['#f9f6f0', '#e3f2fd', '#e8f5e9', '#fff3e0', '#f3e5f5', '#faedcd'];
                
                colorBtn.addEventListener('click', function() {
                    const randomIndex = Math.floor(Math.random() * bgColors.length);
                    document.body.style.backgroundColor = bgColors[randomIndex];
                });
            }
        });
    </script>

    <!-- Скрипт валидации для Task 1 -->
