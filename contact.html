<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Le Audaci</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Created by Akerke -->
</head>

<body>

    <nav class="nav-menu">
        <a href="index.html">Home</a>
        <a href="restaurants.html">Restaurants</a>
        <a href="menu.html">Menu</a>
        <a href="recipes.html">Recipes</a>
        <a href="team.html">Our Team</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <main class="contact-section">

        <h1>Book a Table or Contact Us</h1>

        <p class="contact-intro">
            Have a question or want to make a reservation?
            Fill out the form below!
        </p>

        <img src="images/restaurant4.jpg" alt="Italian restaurant" class="contact-image">

        <div class="contact-form">

            <form id="contact-form" action="#" method="POST">

                <div class="form-group">
                    <label for="name">Your Name:</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="reason">Reason for contact:</label>
                    <select id="reason" name="reason">
                        <option value="reservation">Table Reservation</option>
                        <option value="feedback">Restaurant Feedback</option>
                        <option value="partnership">Business Partnership</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message:</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Send Message
                </button>

            </form>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Le Audaci. Project Authors: Assiya, Dariya, Akerke</p>
    </footer>

</body>
</html>
